<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="معرض أفندينا موتورز: سيارات كورية مفحوصة متاحة في مصر والسعودية — كيا، هيونداي، جينيسيس وغيرها. تواصل على واتساب."><meta property="og:title" content="أفندينا موتورز — معرض السيارات"><meta property="og:description" content="معرض أفندينا موتورز: سيارات كورية مفحوصة متاحة في مصر والسعودية — كيا، هيونداي، جينيسيس وغيرها. تواصل على واتساب."><meta property="og:image" content="https://afandinacars.github.io/assets/hero-kia.jpg"><link rel="icon" href="assets/logo.png"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>معرض أفندينا موتورز</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style id="page-style">
/* Layout: a dark showroom band on top, then a filterable grid of car cards; details and admin open as dialogs */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#0B1E28; --muted:#586873; --line:#DAE1E6;
  --accent:#C42320; --accent-ink:#FFFFFF; --ok:#1E7A55; --brass:#9C7020; --sold:#66737C; --wa:#1C8A4A;
  --hero-bg:#002838; --hero-gold:#E2B85A; --hero-ink:#EAF1F4; --hero-muted:#9DB6C2; --chip:#E7ECF0;
  --f-display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A131A; --surface:#111D25; --ink:#E5ECF0; --muted:#97A6AF; --line:#21303A;
  --accent:#EF5049; --accent-ink:#FFFFFF; --ok:#3DB58A; --brass:#D6A84A; --sold:#8C979E; --wa:#3CC47A;
  --hero-bg:#001B27; --hero-gold:#E2B85A; --hero-ink:#EAF1F4; --hero-muted:#8FAAB7; --chip:#192731; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A131A; --surface:#111D25; --ink:#E5ECF0; --muted:#97A6AF; --line:#21303A;
  --accent:#EF5049; --accent-ink:#FFFFFF; --ok:#3DB58A; --brass:#D6A84A; --sold:#8C979E; --wa:#3CC47A;
  --hero-bg:#001B27; --hero-gold:#E2B85A; --hero-ink:#EAF1F4; --hero-muted:#8FAAB7; --chip:#192731; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
*{box-sizing:border-box}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-ink);position:relative;overflow:hidden;isolation:isolate;padding-top:1.25rem;padding-bottom:2.75rem;min-height:min(78vh,640px);display:flex;flex-direction:column}
.hero>.wrap{position:relative;z-index:2;width:100%;flex:1;display:flex;flex-direction:column}
.hero .hero-grid{margin-top:auto;padding-top:3rem}
.hero-slides{position:absolute;inset:0;z-index:0}
.hero-slides img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;opacity:0}
.hero-slides img:first-child{opacity:1}
.hero::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(270deg,rgba(0,22,32,.92) 0%,rgba(0,22,32,.72) 38%,rgba(0,22,32,.18) 75%,rgba(0,22,32,.05) 100%),linear-gradient(0deg,rgba(0,22,32,.85) 0%,rgba(0,22,32,0) 45%),linear-gradient(180deg,rgba(0,22,32,.55) 0%,rgba(0,22,32,0) 22%)}
@media (max-width:760px){.hero{min-height:0}.hero::after{background:linear-gradient(0deg,rgba(0,22,32,.95) 0%,rgba(0,22,32,.78) 55%,rgba(0,22,32,.35) 100%)}.hero .hero-grid{padding-top:9rem}}
@media (prefers-reduced-motion:no-preference){
  .hero-slides img{animation:slide 24s infinite;}
  .hero-slides img:nth-child(2){animation-delay:6s}
  .hero-slides img:nth-child(3){animation-delay:12s}
  .hero-slides img:nth-child(4){animation-delay:18s}
  .hero-slides img:first-child{opacity:1;animation-name:slide-first}
  @keyframes slide-first{0%{opacity:1;transform:scale(1.03)}25%{opacity:1}31%{opacity:0;transform:scale(1)}95%{opacity:0}100%{opacity:1;transform:scale(1.06)}}
  @keyframes slide{0%{opacity:0;transform:scale(1.06)}5%{opacity:1}25%{opacity:1}31%{opacity:0;transform:scale(1)}100%{opacity:0}}
}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:block;background:#FFFFFF;border-radius:16px;padding:6px 10px;line-height:0;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.brand img{display:block;height:96px;width:auto;max-width:100%}
@media (max-width:420px){.brand img{height:76px}}
.hero-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:end;margin-top:2.25rem}
.hero h1{font-size:clamp(1.7rem,4.2vw,2.7rem);font-weight:800}
.hero p{color:var(--hero-muted);max-width:52ch;margin:.75rem 0 0}
.route{border:1px solid rgba(255,255,255,.18);background:rgba(0,22,32,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:14px;padding:16px 18px;display:grid;gap:10px}
.route-row{display:flex;align-items:center;gap:10px;font-size:.9rem}
.route-row .city{font-weight:600;white-space:nowrap}
.route-row .dash{flex:1;border-top:2px dashed rgba(255,255,255,.25);min-width:20px}
.route small{color:var(--hero-muted)}
.stat{display:flex;gap:22px;flex-wrap:wrap;margin-top:1.25rem}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-size:1.6rem;font-weight:500}
.stat span{color:var(--hero-muted);font-size:.82rem}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:1.4rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:.6rem 1rem;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-wa{background:var(--wa);color:#fff}
.btn-ghost{background:transparent;color:inherit;border:1px solid currentColor;opacity:.9}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:transparent;color:var(--sold);border:1px solid var(--sold)}
.btn-sm{padding:.4rem .75rem;font-size:.88rem;border-radius:8px}
.btn svg{width:18px;height:18px;flex:none}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:1.25rem}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55rem .75rem;min-width:0}
.filters input{flex:1 1 220px}
.filters select{flex:0 1 auto}
.check{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted);cursor:pointer}
.result-line{color:var(--muted);font-size:.9rem;padding-bottom:.75rem;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;padding-bottom:2.5rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph{aspect-ratio:4/3;max-width:100%;background:var(--chip);position:relative;display:grid;place-items:center;color:var(--muted);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg.sil{width:70%;height:auto;opacity:.55}
.badges{position:absolute;top:10px;inset-inline-start:10px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:.75rem;font-weight:600;border-radius:999px;padding:.15rem .6rem;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.badge.av{background:var(--ok);color:#fff;border-color:transparent}
.badge.rs{background:var(--brass);color:#fff;border-color:transparent}
.badge.sd{background:var(--sold);color:#fff;border-color:transparent}
.badge.ex{background:transparent;border-style:dashed}
.ph .badge.ex{background:var(--surface)}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:1.05rem;font-weight:700}
.trim{color:var(--muted);font-size:.88rem;margin-top:-4px}
.specs{display:flex;flex-wrap:wrap;gap:6px}
.specs span{background:var(--chip);border-radius:6px;padding:.1rem .5rem;font-size:.8rem}
.where{font-size:.84rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.where svg{width:14px;height:14px;flex:none}
.price{font-family:var(--f-display);font-weight:700;font-size:1.1rem;margin-top:auto;padding-top:4px}
.price small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.8rem}
.card-actions{display:flex;gap:8px}
.card-actions .btn{flex:1}
.empty{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* branches */
.branches{background:var(--hero-bg);color:var(--hero-ink);position:relative;overflow:hidden;padding-block:3rem 3.25rem}
.branches::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.branches .wrap{position:relative}
.br-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.br-head h2{font-size:clamp(1.6rem,3.6vw,2.4rem);font-weight:800}
.br-head p{color:var(--hero-muted);margin:.4rem 0 0;max-width:46ch}
.route-map{margin-block:1.5rem 1.75rem;overflow-x:auto}
.route-map svg{display:block;width:100%;min-width:520px;height:auto}
.route-map .lbl{font-family:var(--f-display);font-weight:700;font-size:15px;fill:var(--hero-ink)}
.route-map .sub{font-family:var(--f-body);font-size:11.5px;fill:var(--hero-muted)}
.route-map .path{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:2 9}
.route-map .p-sa{stroke:var(--hero-gold)}
.route-map .p-eg{stroke:#7FB8E8}
.route-map .node{fill:var(--hero-bg);stroke-width:2.5}
@media (prefers-reduced-motion:no-preference){.route-map .path{animation:sail 1.6s linear infinite}@keyframes sail{to{stroke-dashoffset:-22}}}
.b-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.b-card{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px;display:grid;gap:14px;min-width:0}
.b-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.b-chip{font-size:.75rem;font-weight:600;padding:.15rem .65rem;border-radius:999px;background:rgba(255,255,255,.1);color:var(--hero-ink);display:inline-flex;align-items:center;gap:6px}
.b-chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.b-card h3{font-size:1.25rem;font-weight:800}
.b-card .area{color:var(--hero-muted);font-size:.88rem;margin-top:-10px}
.b-card{background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.015));transition:border-color .2s ease}
.b-card:hover{border-color:rgba(226,184,90,.45)}
.phone{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-block:1px solid rgba(226,184,90,.28)}
.ph-text{display:grid;gap:4px;min-width:0}
.ph-label{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.2em;color:var(--hero-gold)}
.ph-num{font-family:var(--f-display);font-weight:600;font-size:clamp(1.4rem,3.2vw,1.75rem);line-height:1.15;direction:ltr;text-align:right;letter-spacing:.03em;white-space:nowrap;user-select:all;font-variant-numeric:tabular-nums}
.ph-num .cc{color:var(--hero-gold);font-weight:500;margin-inline-end:.3em}
.ph-copy{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid rgba(226,184,90,.55);background:transparent;color:var(--hero-gold);display:grid;place-items:center;cursor:pointer;transition:background .2s ease}
.ph-copy:hover{background:rgba(226,184,90,.12)}
.ph-copy svg{width:18px;height:18px}
.ph-copy.ok{background:var(--hero-gold);color:var(--hero-bg)}
.b-actions .btn{flex:1;padding-block:.7rem}
.foot{color:var(--hero-muted);font-size:.82rem;margin-top:1.75rem}

/* dialogs */
dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--ink);width:min(860px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto}
dialog::backdrop{background:rgba(5,14,12,.6)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.dlg-head h2{font-size:1.15rem}
.x{background:var(--chip);border:0;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:1.1rem;flex:none}
.dlg-body{padding:18px}
.gallery .main{aspect-ratio:16/10;max-width:100%;background:var(--chip);border-radius:12px;overflow:hidden;display:grid;place-items:center}
.gallery .main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-top:8px}
.thumbs button{border:2px solid transparent;border-radius:8px;padding:0;width:72px;height:54px;overflow:hidden;cursor:pointer;flex:none;background:var(--chip)}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.detail-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
.detail-grid>*{min-width:0}
dl.spec{display:grid;grid-template-columns:auto 1fr;gap:0;margin:0}
dl.spec dt,dl.spec dd{padding:.45rem 0;border-bottom:1px solid var(--line);margin:0}
dl.spec dt{color:var(--muted);font-size:.88rem;padding-inline-end:16px}
dl.spec dd{font-weight:500}
.note{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:.92rem;white-space:pre-wrap;margin-top:12px}
.detail-cta{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.big-price{font-family:var(--f-display);font-weight:800;font-size:1.5rem}
.code{font-family:var(--f-mono);color:var(--muted);font-size:.8rem}

/* admin */
.admin-bar{background:var(--chip);border-bottom:1px solid var(--line)}
.admin-bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:8px;font-size:.9rem}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
.form label.wide{grid-column:1/-1}
.form input,.form select,.form textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.5rem .65rem;color:var(--ink);min-width:0;width:100%}
.form textarea{min-height:80px;resize:vertical}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photo{position:relative;width:92px;height:70px;border-radius:8px;overflow:hidden;background:var(--chip)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo button{position:absolute;top:3px;inset-inline-end:3px;border:0;border-radius:6px;background:rgba(0,0,0,.65);color:#fff;font-size:.75rem;cursor:pointer;padding:1px 6px}
.photo .first{position:absolute;bottom:3px;inset-inline-start:3px;background:var(--accent);color:var(--accent-ink);font-size:.68rem;border-radius:4px;padding:0 5px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list-row .t{flex:1 1 200px;min-width:0}
.list-row .t b{display:block}
.list-row .t span{color:var(--muted);font-size:.85rem}
.calc{grid-column:1/-1;background:var(--chip);border-radius:10px;padding:10px 12px;font-size:.88rem;color:var(--ink)}
.calc table{width:100%;border-collapse:collapse}
.calc td{padding:3px 0}
.calc td:last-child{text-align:left}
.calc tr.tot td{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.calc .warn{color:var(--accent)}
.settings{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px;display:grid;gap:12px}
.settings h3{font-size:1rem}
.settings p{margin:0;color:var(--muted);font-size:.85rem}
.check-row{grid-column:1/-1;flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important;font-size:.92rem!important}
.check-row input{width:auto!important}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;font-size:.9rem;z-index:50}

@media (max-width:760px){
  .hero-grid,.detail-grid{grid-template-columns:1fr}
  .hero-grid{gap:20px;margin-top:1.5rem}
}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s ease}.card:hover{transform:translateY(-2px)}}
</style>
<template id="shell">
  <div class="admin-bar" id="adminBar" hidden>
    <div class="wrap">
      <span>أنت تشاهد المعرض كمدير — التعديلات تظهر للعملاء بعد الحفظ.</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-accent btn-sm" id="addCar" type="button">+ إضافة سيارة</button>
        <button class="btn btn-line btn-sm" id="manage" type="button">إدارة السيارات</button>
      </div>
    </div>
  </div>
  <header class="hero">
    <div class="hero-slides" aria-hidden="true">
      <img src="assets/hero-bmw.jpg" alt="" style="object-position:40% 60%">
      <img src="assets/hero-kia.jpg" alt="" loading="lazy" style="object-position:35% 60%">
      <img src="assets/hero-hyundai.jpg" alt="" loading="lazy" style="object-position:55% 60%">
      <img src="assets/hero-amg.jpg" alt="" loading="lazy" style="object-position:45% 65%">
    </div>
    <div class="wrap">
      <div class="topbar">
        <div class="brand"><img src="assets/logo.png" alt="أفندينا موتورز — AFANDINA" width="360" height="379"></div>
        <a class="btn btn-ghost btn-sm" href="#branches">الفروع والتواصل</a>
      </div>
      <div class="hero-grid">
        <div>
          <h1>سيارات كورية مفحوصة، جاهزة في مصر والسعودية</h1>
          <p>بنختار العربية من السوق الكوري بتقرير الفحص والممشى الحقيقي، ونشحنها لحد عندك. ولو العربية اللي في دماغك مش معروضة، ابعتلنا المواصفات ونجيبهالك.</p>
          <div class="stat" id="stats"></div>
          <div class="cta-row" id="heroCta"></div>
        </div>
        <div class="route" aria-label="مسار الاستيراد">
          <div class="route-row"><span class="city">كوريا الجنوبية</span><span class="dash"></span><span class="city">مصر</span></div>
          <div class="route-row"><span class="city">كوريا الجنوبية</span><span class="dash"></span><span class="city">السعودية والخليج</span></div>
          <small>كل عربية معاها كود في المعرض — ابعته على واتساب وهنرد عليك بالتفاصيل والسعر النهائي.</small>
        </div>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div class="filters" role="search">
      <input id="q" type="search" placeholder="ابحث: سورينتو، توسان، GV80…" aria-label="بحث">
      <select id="fBrand" aria-label="الماركة"><option value="">كل الماركات</option></select>

async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",.82));
  }catch(e){return file}
}

  });
  const settings=h("div",{class:"settings"},
    h("h3",null,"معادلة سعر السعودية"),
    h("p",null,"السعر = العربية + جمارك وضريبة (على سعر العربية في كوريا فقط) + شحن العقبة + شحن السعودية + التخليص. بيتطبق على "+autoCount+" عربية متعلم عليها «احسب تلقائياً»."),
    h("p",null,P.rateUpdated?("سعر XE آخر تحديث: "+fmt(P.xeRate)+" وون للدولار ("+P.rateUpdated+")"+" — بعد خصم "+(P.fxBufferKrw||0)+" وون"+(P.fxBufferPct?" و"+P.fxBufferPct+"%":"")+" = "+fmt(P.krwPerUsd)+". بيتحدث تلقائياً كل يوم 9 الصبح بتوقيت مصر، وأي رقم تكتبه بإيدك في سعر الصرف هيتغير مع التحديث الجاي."):"سعر الصرف بيتحدث تلقائياً من XE كل يوم 9 الصبح بتوقيت مصر، ويتخصم منه "+(P.fxBufferKrw||0)+" وون لكل دولار (يعني "+fmt((P.fxBufferKrw||0)*1000)+" وون لكل 1,000$)."),
    h("div",{class:"form"},inputs),
    h("div",{style:"display:flex;gap:10px;flex-wrap:wrap"},psave,pmsg));
  const EF=[["shipping","الشحن ($)"],["clearance","التخليص ($)"],["commission","عمولة الشركة ($)"],["egpPerUsd","سعر الدولار بالجنيه (فاضي = العرض بالدولار)"],["roundTo","تقريب السعر لأقرب"]];
  const E=P.eg;
  const einputs=EF.map(([k,l])=>h("label",null,l,h("input",{id:"pe-"+k,type:"number",step:"any",inputmode:"decimal",value:E[k]==null?"":E[k]})));
  einputs.push(h("label",{class:"wide"},"ملحوظة تظهر جنب السعر (اختياري)",h("input",{id:"pe-note",value:E.note||"",placeholder:"مثلاً: غير شامل الجمارك"})));
  const emsg=h("span",{style:"font-size:.88rem;color:var(--accent);align-self:center"});
  const esave=h("button",{class:"btn btn-accent btn-sm",type:"button"},"حفظ معادلة مصر");
  esave.addEventListener("click",async()=>{
    const next={};for(const [k] of EF){const v=$("pe-"+k).value.trim();next[k]=v===""?null:Number(v)}
    for(const k of ["shipping","clearance","commission"])if(!(next[k]>=0))next[k]=0;
    if(!(next.roundTo>0))next.roundTo=1;
    if(next.egpPerUsd!=null&&!(next.egpPerUsd>0)){emsg.textContent="سعر الجنيه لازم يكون أكبر من صفر أو فاضي.";return}
    next.note=$("pe-note").value.trim();
    const before=JSON.stringify(state);state.pricing.eg=Object.assign({},state.pricing.eg,next);
    esave.disabled=true;const ok=await save();esave.disabled=false;
    if(!ok)state=JSON.parse(before);render();
  });
  const egSettings=h("div",{class:"settings"},
    h("h3",null,"معادلة سعر مصر"),
    h("p",null,"السعر = العربية (بسعر الوون اللي فوق) + الشحن + التخليص + عمولة الشركة. بيتطبق على "+egCount+" عربية."),
    h("div",{class:"form"},einputs),
    h("div",{style:"display:flex;gap:10px;flex-wrap:wrap"},esave,emsg));
  body.replaceChildren(settings,egSettings,clear||"",rows.length?h("div",null,rows):h("p",null,"لا توجد سيارات بعد."));
  if(!$("manager").open)$("manager").showModal();
}
$("addCar").addEventListener("click",()=>openEditor(null));
$("manage").addEventListener("click",openManager);

(async()=>{
  if(!window.claude||typeof window.claude.use!=="function")return;
  try{
    const [user,art]=await Promise.all([window.claude.use("user"),window.claude.use("artifact")]);
    const can=user?await user.canEdit():false;
    if(!can||!art)return;
    artifactApi=art;
    assetsApi=await window.claude.use("assets");
    $("adminBar").hidden=false;
  }catch(e){}
})();
})();
</script>
