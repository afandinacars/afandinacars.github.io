<style id="page-style">
/* Layout: a dark showroom band on top, then a filterable grid of car cards; details and admin open as dialogs */

:root[data-theme="dark"]{

  --accent:#EF5049; --accent-ink:#FFFFFF; --ok:#3DB58A; --brass:#D6A84A; --sold:#8C979E; --wa:#3CC47A;

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-ink);position:relative;overflow:hidden;isolation:isolate;padding-top:1.25rem;padding-bottom:2.75rem;min-height:min(78vh,640px);display:flex;flex-direction:column}

  @keyframes slide-first{0%{opacity:1;transform:scale(1.03)}25%{opacity:1}31%{opacity:0;transform:scale(1)}95%{opacity:0}100%{opacity:1;transform:scale(1.06)}}

}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

  const els=[...(root||document).querySelectorAll(".card,.pillar,.step,.b-card")];
  const io=new IntersectionObserver(es=>{for(const en of es)if(en.isIntersecting){en.target.classList.remove("below");io.unobserve(en.target)}},{rootMargin:"0px 0px -8% 0px"});
  els.forEach((el,i)=>{el.classList.add("rv");if(el.getBoundingClientRect().top>innerHeight){el.classList.add("below");el.style.transitionDelay=(i%4)*70+"ms";io.observe(el)}});

    const code=err&&err.code;
    if(code==="conflict")toast("في تعديل تاني اتحفظ من جهاز آخر. الصفحة هتتحدث، عيد التعديل بعدها.",4000);
    else if(code==="not_writer"||code==="not_granted"){toast("الصفحة دي للعرض فقط على الحساب ده.",4000);$("adminBar").hidden=true}
    else if(code==="rate_limited")toast("حفظ كتير ورا بعض. استنى دقيقة وجرب تاني.",4000);
    else toast("الحفظ ما نجحش ("+(code||"خطأ")+"). جرب تاني.",4000);
    return false;
  }finally{busy=false}
}

function renderPhotos(){
  $("e-photos").replaceChildren(...draftPhotos.map((p,i)=>{
    const rm=h("button",{type:"button","aria-label":"حذف الصورة"},"حذف");
    rm.addEventListener("click",()=>{draftPhotos.splice(i,1);renderPhotos()});
    const first=i>0?h("button",{type:"button",style:"top:auto;bottom:3px;inset-inline-end:auto;inset-inline-start:3px"},"غلاف"):h("span",{class:"first"},"الغلاف");
    if(i>0)first.addEventListener("click",()=>{draftPhotos.unshift(draftPhotos.splice(i,1)[0]);renderPhotos()});
    return h("div",{class:"photo"},h("img",{src:thumbUrl(p),alt:""}),rm,first);
  }));
}
async function shrink(file,max,q){
  max=max||1600;q=q||.82;
  try{
    const bmp=await createImageBitmap(file);const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",q));
  }catch(e){return file}
}
$("e-file").addEventListener("change",async e=>{
  const files=[...e.target.files];e.target.value="";
  if(!assetsApi){$("e-upmsg").textContent="رفع الصور متاح للمحررين فقط.";return}
  for(let i=0;i<files.length;i++){
    $("e-upmsg").textContent="جاري رفع "+(i+1)+" من "+files.length+"…";
    try{const blob=await shrink(files[i]);const r=await assetsApi.upload(blob);let t=null;try{const tb=await shrink(files[i],480,.72);t=(await assetsApi.upload(tb)).id}catch(e){}draftPhotos.push(t?{id:r.id,t}:{id:r.id});renderPhotos()}
    catch(err){$("e-upmsg").textContent="صورة ما اترفعتش ("+((err&&err.code)||"خطأ")+")";}
  }
  if(/جاري/.test($("e-upmsg").textContent))$("e-upmsg").textContent="";
});

function openEditor(c){
  editing=c||null;
  $("eTitle").textContent=c?"تعديل: "+title(c):"إضافة سيارة";
  $("e-msg").textContent="";$("e-upmsg").textContent="";
  for(const f of FIELDS){const el=$("e-"+f);const v=c?c[f]:({body:"suv",fuel:"petrol",drive:"fwd",branch:"eg-10r",status:"available",currency:"EGP"})[f];el.value=v==null?"":v}
  {const v=c?c.brand:"";const known=!v||BRAND_SET.has(v);$("e-brand").value=known?(v||""):OTHER;$("e-brand-other").value=known?"":v;$("e-brand-other-wrap").hidden=known}
  $("e-mode").value=c?modeOf(c):"";renderCalc();
  draftPhotos=c?[...(c.photos||[])]:[];renderPhotos();
  $("manager").open&&$("manager").close();
  $("editor").showModal();
}
$("saveCar").addEventListener("click",async()=>{
  const data={};
  for(const f of FIELDS){let v=$("e-"+f).value.trim();if(NUMS.has(f))v=v===""?null:Number(v);data[f]=v}
  if(data.brand===OTHER)data.brand=$("e-brand-other").value.trim();
  if(!data.brand||!data.model){$("e-msg").textContent="اكتب الماركة والموديل على الأقل.";return}
  const mode=$("e-mode").value;data.auto=mode||false;
  if(mode){
    if(!state.pricing.krwPerUsd){$("e-msg").textContent="حط سعر الدولار بالوون الأول من إدارة السيارات.";return}
    if(!data.krw){$("e-msg").textContent="اكتب سعر العربية في كوريا بالوون.";return}
    data.price=null;data.currency=mode==="sa"?"SAR":"USD";
  }
  const before=JSON.stringify(state);
  const removed=editing?photoIds(editing.photos).filter(id=>!photoIds(draftPhotos).includes(id)):[];
  if(editing){Object.assign(editing,data,{photos:draftPhotos,sample:false})}
  else{const maxAdded=state.cars.reduce((m,c)=>Math.max(m,c.added||0),0);
    state.cars.push(Object.assign({id:"c"+Date.now().toString(36)},data,{photos:draftPhotos,added:maxAdded+1}))}
  $("saveCar").disabled=true;$("e-msg").textContent="";
  if(removed.length)await dropAssets(removed);
  const ok=await save();
  $("saveCar").disabled=false;
  if(!ok){state=JSON.parse(before)}else{$("editor").close()}
  refreshBrandOptions();render();
});

function openManager(){
  const body=$("mBody");
  const rows=[...state.cars].sort((a,b)=>(b.added||0)-(a.added||0)).map(c=>{
    const del=h("button",{class:"btn btn-danger btn-sm",type:"button"},"حذف");
    let armed=false;
    del.addEventListener("click",async()=>{
      if(!armed){armed=true;del.textContent="تأكيد الحذف";setTimeout(()=>{armed=false;del.textContent="حذف"},4000);return}
      const before=JSON.stringify(state);
      del.disabled=true;del.textContent="جاري الحذف…";
      await dropAssets(photoIds(c.photos));
      state.cars=state.cars.filter(x=>x.id!==c.id);
      if(!(await save()))state=JSON.parse(before);
      refreshBrandOptions();render();openManager();
    });
    const st=h("select",{"aria-label":"الحالة","class":"btn-sm",style:"border:1px solid var(--line);border-radius:8px;background:var(--bg)"});
    fillSelect(st,Object.entries(STATUS));st.value=c.status||"available";
    st.addEventListener("change",async()=>{const old=c.status;c.status=st.value;if(!(await save())){c.status=old;st.value=old}render()});
    return h("div",{class:"list-row"},
      h("div",{class:"t"},h("b",null,title(c)+" "+(c.year||"")+(c.sample?" (مثال)":"")),h("span",null,(BRANCHES[c.branch]||{}).short||"","  ·  ",c.id)),
      st,h("button",{class:"btn btn-line btn-sm",type:"button",onclick:()=>openEditor(c)},"تعديل"),del);
  });
  const samples=state.cars.filter(c=>c.sample).length;
  const clear=samples?h("button",{class:"btn btn-danger btn-sm",type:"button",style:"margin-bottom:12px"},"حذف كل سيارات المثال ("+samples+")"):null;
  if(clear){let armed=false;clear.addEventListener("click",async()=>{
    if(!armed){armed=true;clear.textContent="تأكيد حذف "+samples+" سيارات مثال";return}
    const before=JSON.stringify(state);state.cars=state.cars.filter(c=>!c.sample);
    if(!(await save()))state=JSON.parse(before);refreshBrandOptions();render();openManager()})}
  const P=state.pricing;
  const autoCount=state.cars.filter(c=>modeOf(c)==="sa").length, egCount=state.cars.filter(c=>modeOf(c)==="eg").length;
  const inputs=PFIELDS.map(([k,l])=>h("label",null,l,h("input",{id:"p-"+k,type:"number",step:"any",inputmode:"decimal",value:P[k]==null?"":P[k]})));
  const pmsg=h("span",{style:"font-size:.88rem;color:var(--accent);align-self:center"});
  const psave=h("button",{class:"btn btn-accent btn-sm",type:"button"},"حفظ المعادلة وتحديث الأسعار");
  psave.addEventListener("click",async()=>{
    const next={};for(const [k] of PFIELDS){const v=$("p-"+k).value.trim();next[k]=v===""?null:Number(v)}
    if(!(next.krwPerUsd>0)||!(next.sarPerUsd>0)){pmsg.textContent="سعر الصرف لازم يكون رقم أكبر من صفر.";return}
    for(const k of ["shipKorea","shipSaudi","clearance","customsPct","vatPct","marginUsd"])if(next[k]==null)next[k]=0;
    if(!(next.roundSar>0))next.roundSar=1;
    if(!(next.fxBufferPct>=0))next.fxBufferPct=0;
    if(!(next.fxBufferKrw>=0))next.fxBufferKrw=0;
    const old=state.pricing;
    if(old.xeRate&&(next.fxBufferPct!==old.fxBufferPct||next.fxBufferKrw!==old.fxBufferKrw)&&next.krwPerUsd===old.krwPerUsd)next.krwPerUsd=Math.round((old.xeRate-next.fxBufferKrw)*(1-next.fxBufferPct/100)*100)/100;
    const before=JSON.stringify(state);state.pricing=Object.assign({},state.pricing,next);
    psave.disabled=true;const ok=await save();psave.disabled=false;
    if(!ok)state=JSON.parse(before);render();
  });
  const settings=h("div",{class:"settings"},
    h("h3",null,"معادلة سعر السعودية"),
    h("p",null,"السعر = العربية + جمارك وضريبة (على سعر العربية في كوريا فقط) + شحن العقبة + شحن السعودية + التخليص. بيتطبق على "+autoCount+" عربية متعلم عليها «احسب تلقائياً»."),
    h("p",null,P.rateUpdated?("سعر XE آخر تحديث: "+fmt(P.xeRate)+" وون للدولار ("+P.rateUpdated+")"+" — بعد خصم "+(P.fxBufferKrw||0)+" وون"+(P.fxBufferPct?" و"+P.fxBufferPct+"%":"")+" = "+fmt(P.krwPerUsd)+". بيتحدث تلقائياً كل يوم 9 الصبح بتوقيت مصر، وأي رقم تكتبه بإيدك في سعر الصرف هيتغير مع التحديث الجاي."):"سعر الصرف بيتحدث تلقائياً من XE كل يوم 9 الصبح بتوقيت مصر، ويتخصم منه "+(P.fxBufferKrw||0)+" وون لكل دولار (يعني "+fmt((P.fxBufferKrw||0)*1000)+" وون لكل 1,000$)."),
    h("div",{class:"form"},inputs),
    h("div",{style:"display:flex;gap:10px;flex-wrap:wrap"},psave,pmsg));
  const EF=[["shipping","الشحن ($)"],["clearance","التخليص ($)"],["commission","عمولة الشركة ($)"],["egpPerUsd","سعر الدولار بالجنيه (فاضي = العرض بالدولار)"],["roundTo","تقريب السعر لأقرب"]];
  const E=P.eg;
  const einputs=EF.map(([k,l])=>h("label",null,l,h("input",{id:"pe-"+k,type:"number",step:"any",inputmode:"decimal",value:E[k]==null?"":E[k]})));
  einputs.push(h("label",{class:"wide"},"ملحوظة تظهر جنب السعر (اختياري)",h("input",{id:"pe-note",value:E.note||"",placeholder:"مثلاً: غير شامل الجمارك"})));
  const emsg=h("span",{style:"font-size:.88rem;color:var(--accent);align-self:center"});
  const esave=h("button",{class:"btn btn-accent btn-sm",type:"button"},"حفظ معادلة مصر");
  esave.addEventListener("click",async()=>{
    const next={};for(const [k] of EF){const v=$("pe-"+k).value.trim();next[k]=v===""?null:Number(v)}
    for(const k of ["shipping","clearance","commission"])if(!(next[k]>=0))next[k]=0;
    if(!(next.roundTo>0))next.roundTo=1;
    if(next.egpPerUsd!=null&&!(next.egpPerUsd>0)){emsg.textContent="سعر الجنيه لازم يكون أكبر من صفر أو فاضي.";return}
    next.note=$("pe-note").value.trim();
    const before=JSON.stringify(state);state.pricing.eg=Object.assign({},state.pricing.eg,next);
    esave.disabled=true;const ok=await save();esave.disabled=false;
    if(!ok)state=JSON.parse(before);render();
  });
  const egSettings=h("div",{class:"settings"},
    h("h3",null,"معادلة سعر مصر"),
    h("p",null,"السعر = العربية (بسعر الوون اللي فوق) + الشحن + التخليص + عمولة الشركة. بيتطبق على "+egCount+" عربية."),
    h("div",{class:"form"},einputs),
    h("div",{style:"display:flex;gap:10px;flex-wrap:wrap"},esave,emsg));
  body.replaceChildren(settings,egSettings,clear||"",rows.length?h("div",null,rows):h("p",null,"لا توجد سيارات بعد."));
  if(!$("manager").open)$("manager").showModal();
}
$("addCar").addEventListener("click",()=>openEditor(null));
$("manage").addEventListener("click",openManager);

(async()=>{
  if(!window.claude||typeof window.claude.use!=="function")return;
  try{
    const [user,art]=await Promise.all([window.claude.use("user"),window.claude.use("artifact")]);
    const can=user?await user.canEdit():false;
    if(!can||!art)return;
    artifactApi=art;
    assetsApi=await window.claude.use("assets");
    $("adminBar").hidden=false;
  }catch(e){}
})();
})();
