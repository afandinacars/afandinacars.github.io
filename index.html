/* request */
.req{background:linear-gradient(180deg,var(--bg),var(--chip));border-top:1px solid var(--line);padding-block:3rem;scroll-margin-top:12px}
.req-grid{display:grid;grid-template-columns:.9fr 1.3fr;gap:36px;align-items:start}
.req-grid>*{min-width:0}
.req h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;margin-top:.6rem}
.req-intro p{color:var(--muted);font-size:1.08rem;line-height:1.75;margin:.9rem 0 0;max-width:46ch}
.req-form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;box-shadow:0 18px 40px -24px rgba(11,30,40,.35)}
.req-form label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted);min-width:0}
.req-form input,.req-form select,.req-form textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.65rem .75rem;color:var(--ink);min-width:0;width:100%;font-size:.95rem}
.req-form .wide{grid-column:1/-1}
.r-country{border:0;margin:0;padding:0;display:flex;gap:14px;align-items:center;flex-wrap:wrap;grid-column:1/-1}
.r-country legend{font-size:.85rem;color:var(--muted);float:inline-start;margin-inline-end:6px}
.r-country label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:.95rem}
.r-country input{width:auto}
.req-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.req-foot .btn{padding:.8rem 1.4rem}
#r-msg{font-size:.88rem;color:var(--sold)}
@media (max-width:820px){.req-grid{grid-template-columns:1fr;gap:20px}}
@media (max-width:440px){.req-form{grid-template-columns:1fr}}

/* about */
.top-links{display:flex;gap:8px;flex-wrap:wrap}
.top-links .btn{background:rgba(0,26,38,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.top-links .btn svg{width:16px;height:16px}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.about{background:var(--surface);border-top:1px solid var(--line);padding-block:3rem 3.25rem;scroll-margin-top:12px}
.about-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:40px;align-items:start}
.about-grid>*{min-width:0}
.eyebrow{font-size:.72rem;color:var(--accent);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.eyebrow .en{font-family:var(--f-mono);letter-spacing:.22em;font-weight:500}
.eyebrow::after{content:"";height:1px;width:48px;background:currentColor;opacity:.5}
.about h2{font-size:clamp(2.1rem,5vw,3.2rem);font-weight:800;margin-top:.6rem}
.about .eyebrow{font-size:.95rem}
.about .lead{color:var(--muted);font-size:1.2rem;line-height:1.75;max-width:58ch;margin:1rem 0 0}
.about .lead+.lead{margin-top:.6rem}
.pillars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;list-style:none;margin:0;padding:0}
.pillar{border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:8px;background:var(--bg)}
.pillar .ic{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;background:var(--chip);color:var(--accent)}
.pillar .ic svg{width:26px;height:26px}
.pillar h3{font-size:1.3rem;font-weight:800}
.pillar p{margin:0;color:var(--muted);font-size:1.05rem;line-height:1.65}
@media (max-width:760px){.about-grid{grid-template-columns:1fr;gap:24px}}
@media (max-width:440px){.pillars{grid-template-columns:1fr}}

/* steps */
.steps{background:var(--bg);padding-block:3rem 3.25rem;scroll-margin-top:12px}
.steps h2{font-size:clamp(2.1rem,5vw,3.2rem);font-weight:800;margin-top:.6rem}
.steps .eyebrow{font-size:.95rem}
.step-list{list-style:none;margin:1.75rem 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;counter-reset:none;position:relative}
.step-list::before{content:"";position:absolute;top:36px;inset-inline:12%;border-top:2px dashed var(--line);z-index:0}
.step{position:relative;z-index:1;display:grid;gap:8px;justify-items:start;padding:0 4px}
.step-n{position:absolute;top:-8px;inset-inline-start:54px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:.8rem;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.step-ic{width:72px;height:72px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);box-shadow:0 8px 20px -12px rgba(11,30,40,.35)}
.step-ic svg{width:34px;height:34px}
.step h3{font-size:1.6rem;font-weight:800;margin-top:8px}
.step p{margin:0;color:var(--muted);font-size:1.15rem;line-height:1.7}
@media (max-width:860px){.step-list{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:28px}.step-list::before{display:none}}
@media (max-width:440px){.step-list{grid-template-columns:1fr}}

/* footer */
.site-foot{background:#001620;color:#C9D8DF;padding-block:2.5rem 1.25rem;padding-bottom:calc(1.25rem + env(safe-area-inset-bottom,0px))}
.foot-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:28px}
.foot-grid>*{min-width:0}
.foot-logo{display:inline-block;background:rgba(255,255,255,.9);border-radius:14px;padding:4px 10px;line-height:0}
.foot-logo img{height:72px;width:auto;display:block}
.foot-brand p{margin:.8rem 0 0;font-size:.9rem;max-width:36ch;color:#9DB6C2}
.site-foot h3{font-family:var(--f-display);font-size:.95rem;font-weight:700;color:#fff;margin-bottom:.6rem}
.foot-links,.foot-contact{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.site-foot a{color:#C9D8DF;text-decoration:none;font-size:.92rem}
.site-foot a:hover{color:#E2B85A}
.foot-contact bdi{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.foot-soc{display:flex;gap:8px;list-style:none;margin:8px 0 0;padding:0;flex-wrap:wrap}
.foot-soc a{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(226,184,90,.4);color:#E2B85A}
.foot-soc a:hover{background:#E2B85A;color:#001620}
.foot-soc svg{width:17px;height:17px}
.foot-bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.1);margin-top:2rem;padding-top:1rem;font-size:.82rem;color:#8FAAB7}
@media (max-width:560px){.foot-grid{grid-template-columns:1fr}}

/* floating whatsapp */
.fab{position:fixed;z-index:40;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-end:max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-btn{width:60px;height:60px;border-radius:50%;border:0;background:#25A35A;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 26px -8px rgba(0,0,0,.45);transition:transform .2s ease}
.fab-btn:hover{transform:scale(1.06)}
.fab-btn svg{width:30px;height:30px}
@media (prefers-reduced-motion:no-preference){.fab-btn::before{content:"";position:absolute;width:60px;height:60px;border-radius:50%;border:2px solid #25A35A;animation:pulse 2.4s ease-out infinite;pointer-events:none}@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.55);opacity:0}}}
.fab-menu{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px -12px rgba(0,0,0,.35);padding:10px;display:grid;gap:6px;min-width:220px}
.fab-title{font-size:.8rem;color:var(--muted);padding:2px 6px}
.fab-menu a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink);background:var(--bg)}
.fab-menu a:hover{background:var(--chip)}
.fab-menu b{font-family:var(--f-display)}
body:has(dialog[open]) .fab{display:none}

/* branches */
.branches{scroll-margin-top:12px;background:var(--hero-bg);color:var(--hero-ink);position:relative;overflow:hidden;padding-block:3rem 3.25rem}
.branches::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.branches .wrap{position:relative}
.br-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.br-head h2{font-size:clamp(1.6rem,3.6vw,2.4rem);font-weight:800}
.br-head p{color:var(--hero-muted);margin:.4rem 0 0;max-width:46ch}
.route-map{margin-block:1.5rem 1.75rem;overflow-x:auto}
.route-map svg{display:block;width:100%;min-width:520px;height:auto}
.route-map .lbl{font-family:var(--f-display);font-weight:700;font-size:15px;fill:var(--hero-ink)}
.route-map .sub{font-family:var(--f-body);font-size:11.5px;fill:var(--hero-muted)}
.route-map .path{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:2 9}
.route-map .p-sa{stroke:var(--hero-gold)}
.route-map .p-eg{stroke:#7FB8E8}
.route-map .node{fill:var(--hero-bg);stroke-width:2.5}
@media (prefers-reduced-motion:no-preference){.route-map .path{animation:sail 1.6s linear infinite}@keyframes sail{to{stroke-dashoffset:-22}}}
.b-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.b-card{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px;display:grid;gap:14px;min-width:0}
.b-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.b-chip{font-size:.75rem;font-weight:600;padding:.15rem .65rem;border-radius:999px;background:rgba(255,255,255,.1);color:var(--hero-ink);display:inline-flex;align-items:center;gap:6px}
.b-chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.b-card h3{font-size:1.25rem;font-weight:800}
.b-card .area{color:var(--hero-muted);font-size:.88rem;margin-top:-10px}
.b-card{background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.015));transition:border-color .2s ease}
.b-card:hover{border-color:rgba(226,184,90,.45)}
.phone{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-block:1px solid rgba(226,184,90,.28)}
.ph-text{display:grid;gap:4px;min-width:0}
.ph-label{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.2em;color:var(--hero-gold)}
.ph-num{font-family:var(--f-display);font-weight:600;font-size:clamp(1.4rem,3.2vw,1.75rem);line-height:1.15;direction:ltr;text-align:right;letter-spacing:.03em;white-space:nowrap;user-select:all;font-variant-numeric:tabular-nums}
.ph-num .cc{color:var(--hero-gold);font-weight:500;margin-inline-end:.3em}
.ph-copy{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid rgba(226,184,90,.55);background:transparent;color:var(--hero-gold);display:grid;place-items:center;cursor:pointer;transition:background .2s ease}
.ph-copy:hover{background:rgba(226,184,90,.12)}
.ph-copy svg{width:18px;height:18px}
.ph-copy.ok{background:var(--hero-gold);color:var(--hero-bg)}
.b-actions .btn{flex:1;padding-block:.7rem}
.addr{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-top:-6px}
.addr .area{margin-top:0;min-width:0}
.map-btn{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--hero-gold);font-size:.72rem}
.map-btn svg{width:20px;height:20px;box-sizing:content-box;padding:11px;border-radius:50%;border:1px solid rgba(226,184,90,.55);transition:background .2s ease,color .2s ease}
.map-btn:hover svg,.map-btn:focus-visible svg{background:var(--hero-gold);color:var(--hero-bg)}
.b-card .area{line-height:1.6}
.hours{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--hero-gold);margin-top:-6px}
.hours svg{width:16px;height:16px;flex:none}
.social{margin-top:2.25rem;display:flex;align-items:center;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;padding-top:1.5rem;border-top:1px solid rgba(226,184,90,.25)}
.social h3{font-family:var(--f-display);font-size:1.05rem;font-weight:700}
.social h3 small{display:block;font-family:var(--f-body);font-weight:400;font-size:.82rem;color:var(--hero-muted);margin-top:2px}
.soc-list{display:flex;gap:12px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.soc{--brand:var(--hero-gold);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--hero-gold);border:1px solid rgba(226,184,90,.5);background:rgba(255,255,255,.04);text-decoration:none;transition:background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease}
.soc svg{width:22px;height:22px}
.soc-list{gap:14px 18px}
.soc-item{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--hero-muted);font-size:.76rem;min-width:56px}
.soc-item:hover .soc,.soc-item:focus-visible .soc{background:var(--brand);border-color:var(--brand);color:#fff;transform:translateY(-2px)}
.soc-item:hover .soc-cap,.soc-item:focus-visible .soc-cap{color:var(--hero-ink)}
.soc-cap{white-space:nowrap;transition:color .2s ease}
.foot{color:var(--hero-muted);font-size:.82rem;margin-top:1.75rem}

/* dialogs */
dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--ink);width:min(860px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto}
dialog::backdrop{background:rgba(5,14,12,.6)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.dlg-head h2{font-size:1.15rem}
.x{background:var(--chip);border:0;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:1.1rem;flex:none}
.dlg-body{padding:18px}
.gallery .main{aspect-ratio:4/5;max-height:72vh;width:100%;max-width:100%;background:#0b1419;border-radius:12px;overflow:hidden;display:grid;place-items:center;position:relative}
.gallery .main>*{grid-area:1/1}
.gallery .main .bg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);max-width:none;object-fit:cover;filter:blur(22px) brightness(.6);transform:scale(1.05)}
.gallery .main .fg{position:relative;width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-top:8px}
.thumbs button{border:2px solid transparent;border-radius:8px;padding:0;width:72px;height:54px;overflow:hidden;cursor:pointer;flex:none;background:var(--chip)}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.detail-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
.detail-grid>*{min-width:0}
dl.spec{display:grid;grid-template-columns:auto 1fr;gap:0;margin:0}
dl.spec dt,dl.spec dd{padding:.45rem 0;border-bottom:1px solid var(--line);margin:0}
dl.spec dt{color:var(--muted);font-size:.88rem;padding-inline-end:16px}
dl.spec dd{font-weight:500}
.note{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:.92rem;white-space:pre-wrap;margin-top:12px}
.detail-cta{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.big-price{font-family:var(--f-display);font-weight:800;font-size:1.5rem}
.code{font-family:var(--f-mono);color:var(--muted);font-size:.8rem}

/* admin */
.admin-bar{background:var(--chip);border-bottom:1px solid var(--line)}
.admin-bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:8px;font-size:.9rem}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
.form label.wide,.form>div.wide{grid-column:1/-1}
.form input,.form select,.form textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.5rem .65rem;color:var(--ink);min-width:0;width:100%}
.form textarea{min-height:80px;resize:vertical}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photo{position:relative;width:92px;height:70px;border-radius:8px;overflow:hidden;background:var(--chip)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo button{position:absolute;top:3px;inset-inline-end:3px;border:0;border-radius:6px;background:rgba(0,0,0,.65);color:#fff;font-size:.75rem;cursor:pointer;padding:1px 6px}
.photo .first{position:absolute;bottom:3px;inset-inline-start:3px;background:var(--accent);color:var(--accent-ink);font-size:.68rem;border-radius:4px;padding:0 5px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list-row .t{flex:1 1 200px;min-width:0}
.list-row .t b{display:block}
.list-row .t span{color:var(--muted);font-size:.85rem}
.calc{grid-column:1/-1;background:var(--chip);border-radius:10px;padding:10px 12px;font-size:.88rem;color:var(--ink)}
.calc table{width:100%;border-collapse:collapse}
.calc td{padding:3px 0}
.calc td:last-child{text-align:left}
.calc tr.tot td{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.calc .warn{color:var(--accent)}
.settings{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px;display:grid;gap:12px}
.settings h3{font-size:1rem}
.settings p{margin:0;color:var(--muted);font-size:.85rem}
.check-row{grid-column:1/-1;flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important;font-size:.92rem!important}
.check-row input{width:auto!important}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;font-size:.9rem;z-index:50}

@media (max-width:760px){
  .hero-grid,.detail-grid{grid-template-columns:1fr}
  .hero-grid{gap:20px;margin-top:1.5rem}
}
@media (prefers-reduced-motion:no-preference){
  .rv{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
  .rv.below{transform:translateY(26px)}
}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease}.card:hover{transform:translateY(-4px)}}

/* quick filters */
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-2px;padding-inline:2px}
.quick::-webkit-scrollbar{display:none}
.quick:empty{display:none}
.qchip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.42rem .9rem;font-size:.9rem;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s ease,border-color .15s ease,color .15s ease}
.qchip small{color:var(--muted);font-family:var(--f-mono);font-size:.75rem}
.qchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.qchip[aria-pressed="true"] small{color:inherit;opacity:.75}
/* recently viewed */
.recent{padding-bottom:1rem}
.recent h2{font-size:1rem;font-weight:700;margin-bottom:.6rem;display:flex;align-items:center;justify-content:space-between;gap:8px}
.recent h2 button{border:0;background:none;color:var(--muted);font-size:.82rem;cursor:pointer;font-family:var(--f-body);font-weight:400}
.recent-row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.mini{flex:none;width:200px;scroll-snap-align:start;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;text-align:start;color:var(--ink)}
.mini img,.mini .sil-box{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:var(--chip)}
.mini b{display:block;font-size:.86rem;line-height:1.3}
.mini span{display:block;font-size:.76rem;color:var(--muted)}
/* swipe gallery */
.gallery .main{display:block}
.g-track{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.g-track::-webkit-scrollbar{display:none}

async function shrink(file,max,q){
  max=max||1600;q=q||.82;
  try{
    const bmp=await createImageBitmap(file);const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",q));
  }catch(e){return file}
}
